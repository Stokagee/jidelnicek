name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/stokagee/jidelnicek-ci:latest
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    env:
      UV_LINK_MODE: copy
      PYTHONPATH: .

    steps:
      # 1. Stažení hlavního projektu
      - name: Checkout jidelnicek
        uses: actions/checkout@v4

      # 2. Stažení vedlejšího repozitáře do dočasné složky
      - name: Checkout robotframework-talosforge (temp)
        uses: actions/checkout@v4
        with:
          repository: stokagee/robotframework-talosforge
          path: talosforge_tmp

      # 3. Přesun o úroveň výš, aby ho uv vidělo přes "../"
      - name: Move talosforge to sibling directory
        run: |
          mv talosforge_tmp ../robotframework-talosforge

      # 4. Příprava .env souboru (včetně chybějícího SESSION_SECRET)
      - name: Create .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            echo "SESSION_SECRET=ci_test_secret_key_123_abc" >> .env
          else
            echo "POSTGRES_DB=jidelnicek" >> .env
            echo "POSTGRES_USER=postgres" >> .env
            echo "POSTGRES_PASSWORD=postgres" >> .env
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jidelnicek" >> .env
            echo "REDIS_URL=redis://localhost:6379/0" >> .env
            echo "SESSION_SECRET=ci_test_secret_key_123_abc" >> .env
          fi

      # 5. Kompletní synchronizace závislostí včetně dev/test skupin
      - name: Install all dependencies
        run: uv sync --all-groups

      # 6. Spuštění databáze a redis z docker-compose
      - name: Start Infrastructure (DB & Redis)
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env up -d db redis
          sleep 5

      # 7. Spuštění testů bezpečně přes modul pythonu
      - name: Run pytest
        run: uv run python -m pytest

      # 8. Vyčištění kontejnerů po testech (opraveno o --env-file)
      - name: Stop Infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down