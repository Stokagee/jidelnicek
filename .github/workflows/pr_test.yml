name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    container:
      image: ghcr.io/stokagee/jidelnicek-ci:latest
      options: --user root --add-host=host.docker.internal:host-gateway
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    env:
      PYTHONPATH: .

    steps:
      # 1. Stažení hlavního projektu
      - name: Checkout jidelnicek
        uses: actions/checkout@v4

      # 2. Stažení vedlejšího repozitáře do dočasné složky
      - name: Checkout robotframework-talosforge (temp)
        uses: actions/checkout@v4
        with:
          repository: stokagee/robotframework-talosforge
          path: talosforge_tmp

      # 3. Přesun o úroveň výš, aby seděly cesty z pyproject.toml
      - name: Move talosforge to sibling directory
        run: |
          mv talosforge_tmp ../robotframework-talosforge

      # 4. Příprava .env souboru (pro jistotu, kdyby ho kód přece jen někde četl)
      - name: Create .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            echo "SESSION_SECRET=ci_test_secret_key_123_abc" >> .env
          else
            echo "POSTGRES_DB=postgres" >> .env
            echo "POSTGRES_USER=jidelnicek" >> .env
            echo "POSTGRES_PASSWORD=change-me-strong-password" >> .env
            echo "DATABASE_URL=postgresql://jidelnicek:change-me-strong-password@127.0.0.1:5432/postgres" >> .env
            echo "REDIS_URL=redis://127.0.0.1:6379/0" >> .env
            echo "SESSION_SECRET=ci_test_secret_key_123_abc" >> .env
          fi

      # 5. Instalace balíčků přímo do systému kontejneru
      - name: Install dependencies into container system
        run: |
          uv pip install --system -e ../robotframework-talosforge
          uv pip install --system -e .[dev]

      # 6. Spuštění databáze a redis z docker-compose na hostiteli
      - name: Start Infrastructure (DB & Redis)
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env up -d db redis
          sleep 10

      # 7. Spuštění lokální proxy a následně samotného pytestu v jednom kroku
      - name: Run pytest with local port forwarding
        run: |
          python3 -c "
          import socket, threading, time
          def pipe(s, d):
              try:
                  while True:
                      data = s.recv(4096)
                      if not data: break
                      d.sendall(data)
              except: pass
          def proxy(port):
              srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              srv.bind(('127.0.0.1', port))
              srv.listen(50)
              while True:
                  cli, _ = srv.accept()
                  rem = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  rem.connect(('host.docker.internal', port))
                  threading.Thread(target=pipe, args=(cli, rem), daemon=True).start()
                  threading.Thread(target=pipe, args=(rem, cli), daemon=True).start()
          threading.Thread(target=proxy, args=(5432,), daemon=True).start()
          threading.Thread(target=proxy, args=(6379,), daemon=True).start()
          print('Background proxy for 5432 and 6379 is running...')
          time.sleep(2)
          " &
          pytest

      # 8. Vyčištění kontejnerů po testech
      - name: Stop Infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down