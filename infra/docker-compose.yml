# Local-only orchestration. NFR-2: no public exposure — bind ports to 127.0.0.1
# in production-ish runs by setting HOST_BIND=127.0.0.1 in .env. Defaults below
# listen on all interfaces so other devices on the home LAN can reach the web app.
#
# This is T-0.2: services are runnable stubs. Real behavior lands per epic:
#   api      → EP-3+ (auth) and onward
#   worker   → EP-8 (arq tasks, digest, catch-up)
#   prometheus / grafana → EP-9 (dashboards)

name: jidelnicek

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jidelnicek}
      POSTGRES_USER: ${POSTGRES_USER:-jidelnicek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Europe/Prague}
      PGTZ: ${TZ:-Europe/Prague}
      # FR-O3: consumed by the initdb script to create Grafana's read-only role.
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Read-only role bootstrap; runs once on a fresh data volume (FR-O3).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${HOST_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jidelnicek}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: bring the schema up to head before api/worker start. api refuses
  # to serve against a behind database (issue #69), so a fresh `up` on an empty
  # volume needs this. Reuses the api image (alembic + shared/ are already in it).
  migrate:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jidelnicek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jidelnicek}
      TZ: ${TZ:-Europe/Prague}
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "--no-dev", "alembic", "-c", "shared/alembic.ini", "upgrade", "head"]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    environment:
      # In-network hostnames are fixed (db/redis), independent of the host-side
      # DATABASE_URL/REDIS_URL in .env — those legitimately point at localhost/
      # 127.0.0.1 for host-run pytest. Built from the same credential parts so a
      # password change in .env still propagates here.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jidelnicek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jidelnicek}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TZ: ${TZ:-Europe/Prague}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HOST_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    environment:
      # See the api service: pin in-network hostnames, keep credentials from .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jidelnicek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jidelnicek}
      REDIS_URL: redis://redis:6379/0
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DIGEST_INTERVAL_HOURS: ${DIGEST_INTERVAL_HOURS:-6}
      TZ: ${TZ:-Europe/Prague}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    environment:
      # The browser calls the API same-origin (relative URLs); the Vite dev server
      # proxies /auth, /weeks, ... to the api container. No CORS, and it works for
      # LAN/mobile clients since every request goes through :5173. Do NOT set an
      # absolute VITE_API_BASE_URL here — that forces cross-origin requests that
      # need CORS and break wherever "localhost" isn't the API host.
      API_PROXY_TARGET: http://api:8000
      WEB_PORT: ${WEB_PORT:-5173}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HOST_BIND:-0.0.0.0}:${WEB_PORT:-5173}:5173"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      # FR-O3: Postgres datasource (read-only) — interpolated into provisioning.
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:-db}
      GRAFANA_DB_PORT: ${GRAFANA_DB_PORT:-5432}
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME:-${POSTGRES_DB:-jidelnicek}}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
