# Grafana datasource provisioning (FR-O2/FR-O3). Two datasources:
#   - Prometheus: operational view (API health, latency, error rate).
#   - Postgres:   business view (signups, members, portions per week).
# The owner can add their own dashboards on top without touching this file.
apiVersion: 1

datasources:
  # FR-O2: operational metrics scraped from the api `/metrics` endpoint.
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # FR-O3: business datasource. Uses a READ-ONLY role (skill rule 3) — never the
  # app/admin user. Credentials come from the environment so no secret is
  # committed; see infra/postgres/initdb/10-grafana-readonly.sh.
  - name: Postgres
    type: postgres
    access: proxy
    uid: postgres
    url: ${GRAFANA_DB_HOST:-db}:${GRAFANA_DB_PORT:-5432}
    user: ${GRAFANA_DB_USER:-grafana_ro}
    database: ${GRAFANA_DB_NAME:-jidelnicek}
    isDefault: false
    editable: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
