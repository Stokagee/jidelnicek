global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: home

# Minimal scrape config. The api job scrapes FR-O1 `/metrics` (implemented in
# EP-9). If it reports DOWN with a 404, the running api image predates EP-9 —
# rebuild it: `docker compose build api`.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
