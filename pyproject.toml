[project]
name = "jidelnicek"
version = "0.1.0"
description = "Private home meal-planner for 4 housemates (api + worker + shared)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Dušan Čižmarik" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "robotframework>=7.1",
    "robotframework-requests>=0.9",
    "freezegun>=1.5",
    "python-dotenv>=1.0",
    # Schema-driven test-data generation + strict response validation for the
    # Robot acceptance layer. Local path dependency (see [tool.uv.sources]).
    "TalosForge",
]

[project.scripts]
api = "api.main:cli"
worker = "worker.main:cli"
seed = "shared.scripts.seed:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# TalosForge (Robot Framework data-gen + schema validation) lives in a sibling
# repo and is consumed editable. It is dev/test-only — not a runtime dependency
# of api/worker. Add the `[db]` extra here if a suite needs its Postgres schema
# reader. CI/other machines need this path present (private home project).
[tool.uv.sources]
TalosForge = { path = "../robotframework-talosforge", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "shared"]

# --- Ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["shared/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["B011", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra -q"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: tests that are slow to run (deselect with -m 'not slow')",
]
