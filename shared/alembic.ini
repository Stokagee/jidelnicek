# Alembic config for the jidelnicek data layer.
#
# Run from the repo root:
#   uv run alembic -c shared/alembic.ini upgrade head
#   uv run alembic -c shared/alembic.ini revision -m "describe" --autogenerate
#
# The connection URL is loaded from the DATABASE_URL env var (see env.py),
# not from `sqlalchemy.url` here, so secrets stay out of the repo.

[alembic]
# Script location is resolved relative to this ini file.
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
timezone = Europe/Prague

# Auto-format new revisions with ruff.
hooks = ruff_format,ruff_lint
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = uv
ruff_lint.options = run ruff check --fix REVISION_SCRIPT_FILENAME

# Placeholder; env.py loads the real URL from DATABASE_URL.
sqlalchemy.url = postgresql+psycopg://placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
